name: OWASP CycloneDX (ECMA-424)
pitch: OWASP CycloneDX is a full-stack Bill of Materials (BOM) standard that provides advanced supply chain capabilities for cyber risk reduction.
repositories:
  - name: www-project-cyclonedx
    url: https://github.com/OWASP/www-project-cyclonedx
    description: OWASP Foundation Web Repository
  - name: .github
    url: https://github.com/CycloneDX/.github
  - name: acme-weather-station
    url: https://github.com/CycloneDX/acme-weather-station
    description: A mock IOT weather station with support for BOM retrieval.
  - name: bom-examples
    url: https://github.com/CycloneDX/bom-examples
    description: A repository with examples of CycloneDX BOMs (SBOM, SaaSBOM, OBOM, VEX, etc)
  - name: cdxgen
    url: https://github.com/CycloneDX/cdxgen
    description: Creates CycloneDX Bill of Materials (BOM) for your projects from source and container images. Supports many languages and package managers.
      Integrate in your CI/CD pipeline with automatic submission to Dependency Track server
  - name: cdxgen-action
    url: https://github.com/CycloneDX/cdxgen-action
    description: GitHub action for CycloneDX BOM generator (cdxgen). cdxgen produced bom xml file can be uploaded to dependency track, AppThreat and other
      commercial Software Composition Analysis (SCA) products
  - name: cdxgen-plugins-bin
    url: https://github.com/CycloneDX/cdxgen-plugins-bin
    description: Binary plugins for @cyclonedx/cdxgen npm package
